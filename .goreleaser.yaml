# Builds release binaries when a v* tag is pushed (see .github/workflows/release.yml).
# Try it locally with: goreleaser release --snapshot --clean
version: 2

project_name: starfield

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^Merge pull request"

# Homebrew: create a public repo named homebrew-tap, add a fine-grained token
